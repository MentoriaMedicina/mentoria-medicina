<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#205f83">

    <title>Mentoria Medicina - Student Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="circle-one"></div>
    <div class="circle-two"></div>

    <main class="home-container">

        <header class="header">

            <img
                src="logo.png"
                alt="Mentoria Medicina Logo"
                class="mentoria-logo"
            >

            <h1>Mentoria Medicina</h1>

            <p>STUDENT PORTAL</p>

        </header>


        <section class="portal-container">

            <!-- ATTENDANCE -->
            <a
                href="https://mentoriamedicina.github.io/mentoria-attendance/"
                class="portal-card"
                data-page="Attendance"
            >

                <span class="portal-icon">📋</span>

                <span class="portal-title">
                    Attendance
                </span>

                <span class="portal-arrow">
                    →
                </span>

            </a>


            <!-- LIBRARY -->
            <a
                href="https://mentoriamedicina.github.io/MMedicina/"
                class="portal-card"
                data-page="Library"
            >

                <span class="portal-icon">📚</span>

                <span class="portal-title">
                    Library
                </span>

                <span class="portal-arrow">
                    →
                </span>

            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
